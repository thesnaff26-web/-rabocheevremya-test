<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Рабочее время — Админ</title>
<style>*{box-sizing:border-box}body{margin:0;background:#06111b;color:#f7fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:560px;margin:auto;padding:calc(env(safe-area-inset-top) + 20px) 14px 40px}h1{margin:0}.muted{color:#91a6b7}.card{background:#0b1c2a;border:1px solid #203b50;border-radius:20px;padding:15px;margin-top:12px}input,button{width:100%;padding:14px;border-radius:14px;font-size:16px;margin-top:10px}input{background:#102638;color:white;border:1px solid #203b50}button{border:0;font-weight:700;background:#378cff;color:white}.danger{background:#501a23}.allow{background:#12412e}.hidden{display:none}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stat{text-align:center;background:#0b1c2a;border:1px solid #203b50;border-radius:16px;padding:12px 4px}.n{font-size:24px;font-weight:800}.lbl{font-size:10px;color:#91a6b7}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.badge{font-size:12px;font-weight:700}.device{color:#91a6b7;font-size:14px;margin-top:4px;font-weight:600}.meta{color:#91a6b7;font-size:13px;line-height:1.6;margin-top:8px;word-break:break-all}#logout{width:auto;padding:9px 12px;margin:0;background:#102638}.stat{cursor:pointer;user-select:none}.stat.selected{background:#12344d;border-color:#378cff;box-shadow:0 0 0 1px #378cff inset}.searchWrap{margin-top:12px}.searchWrap input{margin-top:0;font-size:16px}.empty{padding:18px;text-align:center}</style></head><body><main>
<div class="row"><div><h1>Рабочее время</h1><div class="muted">Панель администратора</div></div><button id="logout" class="hidden">Выйти</button></div>
<section id="login" class="card"><b>Вход администратора</b><input id="email" type="email" value="thesnaff260799@mail.ru" autocomplete="username"><input id="password" type="password" placeholder="Пароль" autocomplete="current-password"><button id="loginBtn">Войти</button><div id="msg" class="muted" style="margin-top:10px"></div></section>
<section id="panel" class="hidden"><div class="stats"><div class="stat selected" data-filter="all"><div id="total" class="n">0</div><div class="lbl">ВСЕГО</div></div><div class="stat" data-filter="active"><div id="active" class="n">0</div><div class="lbl">АКТИВНЫХ</div></div><div class="stat" data-filter="blocked"><div id="blocked" class="n">0</div><div class="lbl">БЛОК</div></div></div><div class="searchWrap"><input id="userSearch" type="search" placeholder="🔎 Поиск пользователя" autocomplete="off" autocorrect="off" spellcheck="false"></div><button id="refresh">Обновить</button><div id="devices"></div></section>
</main><script>
const U='https://pwhryvpmjwlfysprdndr.supabase.co',K='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3aHJ5dnBtandsZnlzcHJkbmRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxMjIyMzEsImV4cCI6MjEwNTY5ODIzMX0.ANwWzcqcyzA7Tvd_H5n3fpVAruU_6PUP4d0o5m0Vzcc',S='rv_admin_session_v1';
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function ses(){try{return JSON.parse(localStorage.getItem(S)||'null')}catch{return null}}
function fmtMin(m){m=Math.max(0,Math.round(Number(m)||0));return Math.floor(m/60)+' ч '+String(m%60).padStart(2,'0')+' мин'}
function fmt(x){if(!x)return '—';try{return new Intl.DateTimeFormat('ru-RU',{dateStyle:'short',timeStyle:'short'}).format(new Date(x))}catch{return x}}
function view(on){$('login').classList.toggle('hidden',on);$('panel').classList.toggle('hidden',!on);$('logout').classList.toggle('hidden',!on)}
async function login(){$('msg').textContent='Входим…';try{let r=await fetch(U+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});let d=await r.json();if(!r.ok)throw Error(d.msg||d.error_description||'Ошибка входа');localStorage.setItem(S,JSON.stringify(d));$('password').value='';view(true);await load()}catch(e){$('msg').textContent='Ошибка: '+e.message}}
async function rpc(name,body={}){let s=ses();if(!s?.access_token)throw Error('Нужно войти');let r=await fetch(U+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+s.access_token,'Content-Type':'application/json'},body:JSON.stringify(body),cache:'no-store'});if(r.status===401){localStorage.removeItem(S);view(false);throw Error('Войдите снова')}let t=await r.text();if(!r.ok)throw Error(t||'Ошибка сервера');return t?JSON.parse(t):null}
let allDevices=[],currentFilter='all';
function renderDevices(){
 const box=$('devices'),q=($('userSearch')?.value||'').trim().toLocaleLowerCase('ru-RU');
 let d=allDevices.filter(x=>(currentFilter==='all'||(currentFilter==='active'?x.active:!x.active))&&(!q||String(x.owner_name||'').toLocaleLowerCase('ru-RU').includes(q)));
 box.innerHTML=d.length?d.map(x=>`<div class="card"><div class="row"><div><b>👤 ${esc(x.owner_name||'Имя не указано')}</b><div class="device">📱 ${esc(x.device_name||'Устройство')}</div></div><span class="badge">${x.active?'🟢 Активен':'🔴 Заблокирован'}</span></div><div class="meta">ID: ${esc(x.device_id)}<br>Первый вход: ${esc(fmt(x.created_at))}<br>Последний онлайн: ${esc(fmt(x.last_seen))}</div><div style="margin-top:10px;padding:11px;border:1px solid #203b50;border-radius:14px;background:#081722;line-height:1.65"><b>📊 Текущий месяц</b><br>⏱ Отработано: <b>${fmtMin(x.worked_minutes)}</b><br>🌙 Ночные: <b>${fmtMin(x.night_minutes)}</b><br>🚃 Пассажиром: <b>${fmtMin(x.passenger_minutes)}</b><br>🎁 Праздничные: <b>${fmtMin(x.holiday_minutes)}</b><br>🚆 Поездок: <b>${Number(x.trip_count||0)}</b><br><span class="muted">Синхронизация: ${esc(fmt(x.stats_updated_at))}</span></div><button class="${x.active?'danger':'allow'}" data-id="${esc(x.device_id)}" data-v="${x.active?'0':'1'}" data-name="${esc(x.owner_name||'пользователя')}">${x.active?'⛔ Заблокировать':'✓ Разблокировать'}</button><button class="danger" data-delete="${esc(x.device_id)}">🗑 Удалить устройство</button></div>`).join(''):'<div class="card muted empty">Пользователи не найдены</div>';
 box.querySelectorAll('button[data-id][data-v]').forEach(b=>b.onclick=async()=>{const willActivate=b.dataset.v==='1',name=b.dataset.name||'пользователя';if(!confirm(`${willActivate?'Разблокировать':'Заблокировать'} пользователя «${name}»?`))return;b.disabled=true;try{await rpc('admin_set_device_active',{p_device_id:b.dataset.id,p_active:willActivate});await load()}catch(e){alert(e.message);b.disabled=false}});
 box.querySelectorAll('button[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Удалить это устройство? Оно исчезнет из панели администратора.'))return;b.disabled=true;try{await rpc('admin_delete_device',{p_device_id:b.dataset.delete});await load()}catch(e){alert(e.message);b.disabled=false}})
}
async function load(){let box=$('devices');box.innerHTML='<div class="card muted">Загрузка…</div>';try{let d=await rpc('admin_list_devices');d=Array.isArray(d)?d:[];let st=[];try{st=await rpc('admin_get_device_stats');st=Array.isArray(st)?st:[]}catch(_){};const sm=new Map(st.map(x=>[x.device_id,x]));allDevices=d.map(x=>Object.assign({},x,sm.get(x.device_id)||{}));$('total').textContent=allDevices.length;$('active').textContent=allDevices.filter(x=>x.active).length;$('blocked').textContent=allDevices.filter(x=>!x.active).length;renderDevices()}catch(e){box.innerHTML='<div class="card">Ошибка: '+esc(e.message)+'</div>'}}
document.querySelectorAll('.stat[data-filter]').forEach(el=>el.onclick=()=>{currentFilter=el.dataset.filter;document.querySelectorAll('.stat[data-filter]').forEach(x=>x.classList.toggle('selected',x===el));renderDevices()});
$('userSearch').oninput=renderDevices;
$('loginBtn').onclick=login;$('password').onkeydown=e=>{if(e.key==='Enter')login()};$('refresh').onclick=load;$('logout').onclick=()=>{localStorage.removeItem(S);view(false)};if(ses()?.access_token){view(true);load()}else view(false);
</script></body></html>
